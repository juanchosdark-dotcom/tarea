workflows:
  android-workflow:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build Android debug APK
        script: |
          # Si gradlew está en la raíz, le damos permisos y compilamos
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # Si no está en la raíz, buscamos dentro de la estructura estándar
            gradle assembleDebug
          fi
    artifacts:
      - app/build/outputs/**/*.apk
